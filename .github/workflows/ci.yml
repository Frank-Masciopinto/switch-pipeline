name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: catches newly published vulnerabilities

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Type check
        run: uv run mypy src tests
      - name: Tests with coverage gate (Postgres, Redpanda, Snowflake emulator)
        run: uv run pytest --cov --cov-report=term

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
      - name: Known vulnerabilities in runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > requirements.txt
          uvx pip-audit@2.10.1 --strict --disable-pip -r requirements.txt

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file and build the image
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose build
